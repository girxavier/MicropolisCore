# Pull-request checks; the Micropolis test job rebuilds its Emscripten module.
# No GitHub Pages deployment is performed by this workflow.

name: PR Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: Monorepo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run verify:structure

  build-ts:
    name: TypeScript builds (vitamoo / mooshow / vitamoospace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter vitamoo run build
      - run: pnpm --filter mooshow run build
      - run: pnpm --filter vitamoospace run build

  check-micropolis:
    name: Micropolis svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter micropolis run check

  test:
    name: Tests (sims-io, mooshow, Micropolis WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache
      - run: pnpm --filter vitamoo run build
      - run: pnpm --filter mooshow run build
      - run: pnpm --filter mooshow run test
      - run: pnpm --filter @micropolis/sims-io run build
      - run: pnpm --filter @micropolis/sims-io run test
      - name: Compile Micropolis engine and refresh WASM bindings
        run: |
          pnpm --filter @micropolis/engine-wasm exec tsc --version
          PATH="$PWD/packages/micropolis-engine/node_modules/.bin:$PWD/node_modules/.bin:$PATH" make -C packages/micropolis-engine SHELL=/bin/bash install
      - name: Run Micropolis tests (excluding CLI-only rune bootstrap)
        run: pnpm --filter micropolis exec vitest run --exclude cli/entry.smoke.test.ts --exclude src/lib/monorepo.integration.test.ts
